# Dependency updates, grouped weekly. The architecture is frozen at 1.x: major upgrades of core
# libraries (axum, tokio, sqlx, solid-js) need a green ./dev check and, if behaviour changes,
# benchmark evidence (CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      rust-minor-patch: { update-types: ["minor", "patch"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch: { update-types: ["minor", "patch"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: monthly }
