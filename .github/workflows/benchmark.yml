# Full benchmark, on demand. Prefer a dedicated self-hosted runner: results are only comparable
# on the same machine fingerprint, and regression gates against baseline.json apply only then.
name: benchmark
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runs-on label (use a dedicated machine for comparable numbers)
        default: ubuntu-24.04
      suites:
        description: comma-separated suites
        default: http,auth,cache,outbound,db
permissions:
  contents: read
jobs:
  bench:
    runs-on: ${{ inputs.runner }}
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app-dev-only, POSTGRES_DB: app }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
        ports: ["56380:6379"]
        options: --ulimit memlock=-1
    steps:
      - uses: actions/checkout@v7
      - working-directory: backend
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: backend }
      - run: cargo install oha --locked
      - run: python3 benchmarks/run.py --suite "${{ inputs.suites }}"
      - run: python3 benchmarks/compare.py
        continue-on-error: true
      - run: python3 benchmarks/report.py -o benchmark-report.md && cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with: { name: benchmark-results, path: "benchmarks/results/*.json\nbenchmark-report.md" }
