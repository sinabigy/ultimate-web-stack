# Functional CI. Every check is a confirmed command in .ai/config/project.json, run through
# tools/ai-validate, so local `./dev check`, AI agents and CI execute exactly the same commands.
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://app:app-dev-only@localhost:55432/app

jobs:
  protocol:
    # Protocol state, generator and benchmark-gate self-tests (Python + git only).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/ai-validate --strict --only ai-check --only generator-selftest --only bench-gates-selftest

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app-dev-only, POSTGRES_DB: app }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
        ports: ["56380:6379"]
        options: --ulimit memlock=-1 --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:26.3.25.2
        env: { CLICKHOUSE_DB: app, CLICKHOUSE_USER: app, CLICKHOUSE_PASSWORD: app-dev-only, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" }
        ports: ["58123:8123"]
        options: --ulimit nofile=262144:262144 --health-cmd "wget -qO- http://localhost:8123/ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }  # full history for the secret scan
      - name: Free runner disk (unused preinstalled toolchains)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Rust toolchain (pinned by backend/rust-toolchain.toml)
        working-directory: backend
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: backend }
      - name: sqlx-cli
        run: cargo install sqlx-cli --locked --no-default-features --features rustls,postgres
      - name: Supply-chain tools
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with: { tool: "cargo-deny,cargo-audit" }
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: NATS with JetStream (services cannot pass server flags)
        run: docker run -d --name nats -p 54222:4222 nats:2.14.7-alpine --jetstream
      - name: Migrate the schema used by `cargo sqlx prepare --check`
        working-directory: backend
        run: cargo sqlx migrate run --source migrations
      - name: Validate (backend)
        run: >
          python3 tools/ai-validate --strict --keep-going --report ai-validate-backend.json
          --only rust-fmt --only rust-clippy --only rust-clippy-minimal --only sqlx-offline-fresh --only rust-audit --only rust-deny --only secret-scan --only config-check
          --only rust-test --only rust-test-cedar --only rust-test-cache --only rust-test-nats --only rust-test-clickhouse --only ts-bindings-fresh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ai-validate-backend, path: ai-validate-backend.json }

  gateway:
    # Pingora edge gateway (hyperscale profile): separate workspace, compile + lint only.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - working-directory: backend
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: backend/gateway }
      - run: python3 tools/ai-validate --strict --only gateway-check

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Validate (frontend)
        run: >
          python3 tools/ai-validate --strict --keep-going
          --only web-install --only web-audit --only web-typecheck --only web-lint --only web-test --only web-build --only web-bundle-budget

  deploy-tiers:
    # Every deployment tier verified statically, then the release image built and smoke-tested.
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk (unused preinstalled toolchains)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - run: python3 tools/ai-validate --strict --only infra-verify
      - name: Release image smoke test (release-smoke; run directly so every check is in the log)
        run: infra/docker/smoke.sh
      - name: Live systemd deployment test (systemd-live; run directly so every check is in the log)
        run: infra/systemd/live-test.sh

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    env:
      # Compile against the committed query metadata (backend/.sqlx, kept fresh by the backend
      # job's sqlx-offline-fresh): this job's database is not migrated at build time.
      SQLX_OFFLINE: "true"
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app-dev-only, POSTGRES_DB: app }
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U app" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk (unused preinstalled toolchains)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - working-directory: backend
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { workspaces: backend }
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Playwright browser
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Validate (end-to-end)
        run: python3 tools/ai-validate --strict --only web-build --only e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: frontend/playwright-report }
