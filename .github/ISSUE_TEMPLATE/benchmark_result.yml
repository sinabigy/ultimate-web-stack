name: Benchmark result
description: Share results from your hardware (we compare results per machine, never across machines).
labels: ["benchmark", "evidence"]
body:
  - type: input
    id: commit
    attributes: { label: Blueprint commit or tag, placeholder: v1.0.0 }
    validations: { required: true }
  - type: textarea
    id: machine
    attributes:
      label: Machine
      description: CPU, cores, memory, OS/kernel, where services ran (native, VM — with its CPU/memory — or cloud instance type), anything else running.
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: Command
      render: shell
      value: ./dev benchmark
    validations: { required: true }
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Attach benchmarks/results/<UTC>-<sha>.json (drag the file here) and paste the compare.py summary.
    validations: { required: true }
  - type: textarea
    id: interpretation
    attributes:
      label: What do you think it shows?
      description: If it contradicts a decision, which ADR and which reversal condition? Repeated or interleaved runs carry more weight.
