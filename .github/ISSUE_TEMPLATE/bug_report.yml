name: Bug report
description: Something doesn't work as documented.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Security problems: please report privately (SECURITY.md), not here."
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options: ["blueprint repository", "a generated project", "both", "not sure"]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: "Blueprint tag/commit; for generated projects see README.md line 3 or .ai/config/project.json → architecture.origin.version"
      placeholder: v1.0.0
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Exact commands to reproduce
      render: shell
    validations: { required: true }
  - type: textarea
    id: actual
    attributes:
      label: What happened (paste the failing output)
      render: text
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: "`./dev doctor` output, OS, Docker runtime and memory"
      render: text
