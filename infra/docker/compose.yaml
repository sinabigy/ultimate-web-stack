# Local development services. Profiles mirror architecture profiles: only what a project
# enables is started (`./dev up` reads .ai/config/project.json → architecture.modules).
#
#   core (no profile)  postgres
#   cache              redis            (or `dragonfly` for the RESP-compatible alternative)
#   messaging          nats (+JetStream)
#   analytics          clickhouse
#   identity           zitadel          (self-hosted IdP; tests use the in-repo mock OIDC instead)
#   observability      prometheus, grafana, loki, tempo, otel-collector
#
# Ports are env-overridable (see .env.example) and bound to 127.0.0.1 only.
name: ${COMPOSE_PROJECT_NAME:-uwsb}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-dev-only}
      POSTGRES_DB: app
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports: ["127.0.0.1:${DEV_PG_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../services/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../services/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
