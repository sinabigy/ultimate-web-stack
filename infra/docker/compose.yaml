# Local development services. Profiles mirror architecture profiles: only what a project
# enables is started (`./dev up` reads .ai/config/project.json → architecture.modules).
#
#   core (no profile)  postgres
#   cache              redis            (or `dragonfly` for the RESP-compatible alternative)
#   messaging          nats (+JetStream)
#   analytics          clickhouse
#   identity           zitadel          (self-hosted IdP; tests use the in-repo mock OIDC instead)
#   observability      prometheus, grafana, loki, tempo, alloy (logs from var/log/*.log)
#
# Ports are env-overridable (see .env.example) and bound to 127.0.0.1 only.
name: ${COMPOSE_PROJECT_NAME:-uwsb}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-dev-only}
      POSTGRES_DB: app
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports: ["127.0.0.1:${DEV_PG_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../services/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../../services/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------- cache profile
  # Redis is the default shared cache/rate-limit store. Dragonfly (RESP-compatible, multi-threaded)
  # runs side by side on its own port for compatibility tests and benchmarks.
  redis:
    profiles: ["cache"]
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:${DEV_REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  dragonfly:
    profiles: ["cache", "dragonfly"]
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    command: ["--maxmemory=512mb", "--proactor_threads=2", "--dbfilename="]  # Dragonfly needs >= 256MiB per thread
    ulimits:
      memlock: -1
    ports: ["127.0.0.1:${DEV_DRAGONFLY_PORT:-56380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # ---------------------------------------------------------------- identity profile
  # Self-hosted ZITADEL (default identity provider). Uses the same PostgreSQL server with its own
  # database and role (created by ZITADEL's init with the admin credentials below).
  # The issuer is http://localhost:${DEV_ZITADEL_PORT:-58081}; scripts/zitadel-bootstrap configures
  # the project, OIDC client, roles and test users and writes .env.zitadel (gitignored).
  zitadel:
    profiles: ["identity"]
    image: ghcr.io/zitadel/zitadel:v4.19.4
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "disabled"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:-MasterkeyNeedsToHave32Characters}
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${DEV_ZITADEL_PORT:-58081}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD:-zitadel-dev-only}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: app
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:-app-dev-only}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Blueprint
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin@localhost
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:-Password1!Password1!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: blueprint-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Blueprint bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
      # Keep the built-in login UI (Login V2 is a separate Next.js deployment; see docs).
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
    ports: ["127.0.0.1:${DEV_ZITADEL_PORT:-58081}:8080"]
    volumes:
      - ../../var/zitadel:/machinekey
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 60

  nats:
    profiles: ["messaging"]
    image: nats:2.14.7-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    volumes:
      - natsdata:/data
    ports:
      - "127.0.0.1:${DEV_NATS_PORT:-54222}:4222"
      - "127.0.0.1:${DEV_NATS_MONITOR_PORT:-58222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      retries: 30

  # ── observability profile: metrics, logs, traces (./dev up --with observability) ──────────
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--web.enable-lifecycle"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:${DEV_PROMETHEUS_PORT:-59190}:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      retries: 20

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    ports:
      - "127.0.0.1:${DEV_TEMPO_OTLP_PORT:-54318}:4318"   # OTLP/HTTP: APP__TELEMETRY__OTLP_ENDPOINT=http://127.0.0.1:54318
      - "127.0.0.1:${DEV_TEMPO_PORT:-53200}:3200"

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    ports: ["127.0.0.1:${DEV_LOKI_PORT:-53100}:3100"]

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.20.1
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./observability/alloy.config:/etc/alloy/config.alloy:ro
      - ../../var/log:/var/log/app:ro
    depends_on: [loki]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local development only
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${DEV_GRAFANA_PORT:-53000}:3000"]
    depends_on: [prometheus, loki, tempo]

volumes:
  pgdata:
  natsdata:
  promdata:
  tempodata:
  lokidata:
