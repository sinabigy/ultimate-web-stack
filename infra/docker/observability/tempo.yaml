# Single-binary Tempo for development: OTLP in, local block storage, short retention.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http: { endpoint: "0.0.0.0:4318" }
        grpc: { endpoint: "0.0.0.0:4317" }
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
backend_worker:
  compaction:
    block_retention: 48h
