# Example only (not applied by kustomization.yaml). Create the real Secret out of band
# (external-secrets, sealed-secrets, or kubectl create secret generic app-secrets --from-env-file=...).
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  APP__DATABASE__URL: postgres://app:REPLACE_ME@postgres.example.internal:5432/app
  APP__AUTH__CLIENT_ID: REPLACE_ME
  APP__AUTH__CLIENT_SECRET: REPLACE_ME
  APP__AUTH__TOKEN_ENCRYPTION_KEY: REPLACE_ME_BASE64_32_BYTES
  APP__AUTH__API_KEY_PEPPER: REPLACE_ME
