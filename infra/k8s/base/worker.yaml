apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-worker
  labels: { app.kubernetes.io/name: app-worker }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: app-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: app-worker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 45   # jobs drain on SIGTERM; unfinished leases are reclaimed
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: app
          command: [ "/app/app-worker" ]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          env:
            - { name: APP__WORKER__PORT, value: "9091" }
          ports:
            - { name: ops, containerPort: 9091 }
          livenessProbe:
            httpGet: { path: /healthz, port: ops }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: ops }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 96Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ ALL ] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
