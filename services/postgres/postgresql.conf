# Development settings. Production tuning: docs/operations/postgresql.md
listen_addresses = '*'
max_connections = 200
shared_buffers = 256MB
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
log_min_duration_statement = 250        # slow-query visibility (ms)
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
track_io_timing = on
