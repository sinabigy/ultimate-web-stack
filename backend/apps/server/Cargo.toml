[package]
name = "app-server"
description = "API server binary: composes configuration, adapters and the HTTP router."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "app-server"
path = "src/main.rs"

[features]
# Optional modules (scripts/create-project rewrites `default` from the selected profile).
default = ["redis", "nats", "clickhouse"]
redis = ["app-cache/redis"]
nats = ["app-workers/nats"]
clickhouse = ["app-analytics/clickhouse", "app-api/clickhouse"]
cedar = ["app-api/cedar"]
alloc-mimalloc = ["dep:mimalloc"]
alloc-jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
axum.workspace = true
mimalloc = { version = "0.1", optional = true, default-features = false }
tikv-jemallocator = { version = "0.7", optional = true }
app-analytics.workspace = true
async-trait.workspace = true
app-cache.workspace = true
app-networking.workspace = true
app-workers.workspace = true
app-domain.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
serde_json.workspace = true
app-db.workspace = true
app-api.workspace = true
app-config.workspace = true
app-messaging.workspace = true
app-rate-limit.workspace = true
app-telemetry.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
