[package]
name = "app-analytics"
description = "Event analytics: batched, non-blocking ingestion into ClickHouse; tenant-scoped queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# ClickHouse client, schema, batching sink and queries. Without it: the sink is a no-op and
# enabling analytics in configuration is a startup error.
clickhouse = ["dep:clickhouse"]

[dependencies]
app-config.workspace = true
app-authz.workspace = true
clickhouse = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
metrics.workspace = true
uuid.workspace = true


[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
app-domain.workspace = true

[[test]]
name = "clickhouse"
required-features = ["clickhouse"]

[lints]
workspace = true
