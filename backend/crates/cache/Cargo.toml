[package]
name = "app-cache"
description = "Cache abstraction (in-memory / Redis / Dragonfly), stampede protection, distributed locks, shared rate limiting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Redis/Valkey/Dragonfly adapter (cache + shared rate limiter). Without it: in-process cache only.
redis = ["dep:redis"]

[dependencies]
app-rate-limit.workspace = true
async-trait.workspace = true
bytes.workspace = true
metrics.workspace = true
moka.workspace = true
rand.workspace = true
redis = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util", "net"] }

[[test]]
name = "redis_backends"
required-features = ["redis"]

[lints]
workspace = true
