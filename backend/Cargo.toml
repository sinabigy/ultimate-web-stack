[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# internal
app-config = { path = "crates/config" }
app-errors = { path = "crates/errors" }
app-telemetry = { path = "crates/telemetry" }
app-domain = { path = "crates/domain" }
app-api = { path = "crates/api" }
app-rate-limit = { path = "crates/rate_limit" }
app-messaging = { path = "crates/messaging" }
app-analytics = { path = "crates/analytics" }
app-authz = { path = "crates/authz" }
app-db = { path = "crates/db" }
app-auth = { path = "crates/auth" }
mock-oidc = { path = "apps/mock-oidc" }
fake-upstream = { path = "apps/fake-upstream" }
app-networking = { path = "crates/networking" }
app-workers = { path = "crates/workers" }
app-cache = { path = "crates/cache" }

# core runtime
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { version = "0.8.9", features = ["ws", "macros"] }
tower = { version = "0.5.3", features = ["limit", "load-shed", "timeout", "util"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "propagate-header", "timeout", "limit", "catch-panic", "set-header", "cors", "fs", "sensitive-headers", "csrf"] }
hyper = "1.11"
http = "1"
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
uuid = { version = "1.27", features = ["v4", "v7", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
metrics = "0.24"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "uuid", "time", "json", "ipnet", "macros", "migrate", "derive"] }
ipnet = "2"
async-nats = "0.50"
clickhouse = { version = "0.15", default-features = false, features = ["lz4", "uuid", "time", "inserter", "rustls-tls-ring", "rustls-tls-native-roots"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
moka = { version = "0.12", features = ["future"] }
base64 = "0.22"
sha2 = "0.11"
hmac = "0.13"
aes-gcm = "0.11"
rand = "0.10"
subtle = "2.6"
url = "2.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
openidconnect = { version = "4.0.1", default-features = false }
p256 = { version = "0.13.2", features = ["pem", "jwk"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# test
proptest = "1.11"
ts-rs = { version = "12.0.1", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
strip = "debuginfo"
panic = "unwind"

[profile.bench]
inherits = "release"
